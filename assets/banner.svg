<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070C18" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0" />
      <stop offset="50%" stop-color="#39FF14" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0" />
    </linearGradient>

    <pattern id="bioGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="30" cy="30" r="1" fill="#00C2FF" opacity="0.25" />
    </pattern>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      fill: #F8FAFC;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 14px;
      font-weight: 600;
      fill: #39FF14;
      letter-spacing: 0.5px;
    }
    .meta-label {
      font-size: 11px;
      fill: #64748B;
      letter-spacing: 1px;
    }
    .pill-text {
      font-size: 11px;
      font-weight: 600;
      fill: #E2E8F0;
    }
    .pulse-node {
      animation: pulse 2.5s infinite ease-in-out;
    }
    .pulse-fast {
      animation: pulse 1.2s infinite ease-in-out;
    }
    .scanline {
      animation: scan 6s infinite linear;
    }
    .wave-path {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawWave 4s infinite ease-in-out alternate;
    }
    .cursor {
      animation: blink 1s infinite step-end;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes scan {
      0% { transform: translateY(-20px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(260px); opacity: 0; }
    }
    @keyframes drawWave {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <rect width="900" height="260" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect width="900" height="260" rx="12" fill="url(#bioGrid)" />
  <rect class="scanline" x="0" y="0" width="900" height="2" fill="url(#scanGrad)" />

  <path d="M 16 40 L 16 16 L 45 16" fill="none" stroke="#00C2FF" stroke-width="2" />
  <path d="M 884 40 L 884 16 L 855 16" fill="none" stroke="#39FF14" stroke-width="2" />
  <path d="M 16 220 L 16 244 L 45 244" fill="none" stroke="#B026FF" stroke-width="2" />
  <path d="M 884 220 L 884 244 L 855 244" fill="none" stroke="#FF003C" stroke-width="2" />

  <g transform="translate(620, 35)" opacity="0.9">
    <rect x="0" y="0" width="240" height="190" rx="8" fill="#090D16" fill-opacity="0.8" stroke="#1E293B" stroke-width="1" />
    <text x="15" y="22" class="font-mono meta-label">WORKFLOW // HUMAN-IN-THE-LOOP</text>
    <circle class="pulse-fast" cx="220" cy="18" r="4" fill="#39FF14" filter="url(#glowGreen)" />

    <path class="wave-path" d="M 15 95 Q 40 40, 65 95 T 115 95 L 130 60 L 145 135 L 160 75 L 175 95 Q 200 130, 225 95" fill="none" stroke="#39FF14" stroke-width="2" filter="url(#glowGreen)" />
    <path d="M 15 95 Q 40 150, 65 95 T 115 95 Q 145 45, 175 95 T 225 95" fill="none" stroke="#00C2FF" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.7" />

    <circle class="pulse-node" cx="65" cy="95" r="4" fill="#00C2FF" />
    <circle class="pulse-node" cx="115" cy="95" r="4" fill="#FFEA00" />
    <circle class="pulse-node" cx="175" cy="95" r="4" fill="#B026FF" />

    <line x1="15" y1="145" x2="225" y2="145" stroke="#1E293B" stroke-width="1" />
    <text x="15" y="163" class="font-mono meta-label" fill="#94A3B8">AI ROLE: <tspan fill="#00C2FF">FAST PROTOTYPING</tspan></text>
    <text x="15" y="178" class="font-mono meta-label" fill="#94A3B8">HUMAN ROLE: <tspan fill="#39FF14">LOGIC &amp; UI REVIEW</tspan></text>
  </g>

  <g transform="translate(40, 42)">
    <text x="0" y="0" class="font-mono meta-label">@ARCBASS99 // SURABAYA, INDONESIA</text>
    <text x="0" y="36" class="font-sans title">MUHAMMAD NAFIS ALFA RIZKY</text>

    <text x="0" y="66" class="font-mono subtitle">
      &gt; Biology Student &amp; Frontend Web Developer<tspan class="cursor">_</tspan>
    </text>

    <text x="0" y="98" class="font-sans" font-size="13.5" fill="#94A3B8">
      Building fast, practical web interfaces with TypeScript, JavaScript, and CSS.
    </text>
    <text x="0" y="118" class="font-sans" font-size="13.5" fill="#94A3B8">
      Focused on clean structure, readable code, and real-world usability.
    </text>

    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="110" height="26" rx="4" fill="#0F172A" stroke="#00C2FF" stroke-width="1.2" />
      <circle cx="12" cy="13" r="3" fill="#00C2FF" />
      <text x="22" y="17" class="font-mono pill-text">Clean Code</text>

      <rect x="120" y="0" width="110" height="26" rx="4" fill="#0F172A" stroke="#39FF14" stroke-width="1.2" />
      <circle cx="132" cy="13" r="3" fill="#39FF14" />
      <text x="142" y="17" class="font-mono pill-text">Practical UX</text>

      <rect x="240" y="0" width="115" height="26" rx="4" fill="#0F172A" stroke="#FFEA00" stroke-width="1.2" />
      <circle cx="252" cy="13" r="3" fill="#FFEA00" />
      <text x="262" y="17" class="font-mono pill-text">Business Needs</text>

      <rect x="365" y="0" width="102" height="26" rx="4" fill="#0F172A" stroke="#B026FF" stroke-width="1.2" />
      <circle cx="377" cy="13" r="3" fill="#B026FF" />
      <text x="387" y="17" class="font-mono pill-text">Web Standards</text>

      <rect x="477" y="0" width="105" height="26" rx="4" fill="#0F172A" stroke="#FF003C" stroke-width="1.2" />
      <circle class="pulse-fast" cx="489" cy="13" r="3" fill="#FF003C" />
      <text x="499" y="17" class="font-mono pill-text">Manual QC</text>
    </g>
  </g>
</svg>
